<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strength Visual Field Evidence Fixture</title>
  </head>
  <body>
    <main>
      <section data-testid="exercise-card">
        <h3>Glute Bridge</h3>
        <div>Sets</div>
        <input aria-label="Sets" value="2" />
        <div>Reps</div>
        <input aria-label="Reps" value="15" />
        <textarea aria-label="Coach note">TEST NOTE Glute Bridge - pause 1 sec at top</textarea>
      </section>

      <section data-testid="exercise-card">
        <h3>Forearm Plank</h3>
        <div>Sets</div>
        <input aria-label="Sets" value="3" />
        <div>Duration</div>
        <input aria-label="Duration" value="00:30" />
        <textarea aria-label="Coach note">TEST NOTE Forearm Plank - hips level</textarea>
      </section>

      <section data-testid="exercise-card">
        <h3>Single Leg Calf Raise</h3>
        <div>Sets</div>
        <input aria-label="Sets" value="2" />
        <div>Reps</div>
        <input aria-label="Reps" value="12" />
        <textarea aria-label="Coach note">TEST NOTE Calf Raise - slow 3 sec lower</textarea>
      </section>
    </main>
  </body>
</html>
