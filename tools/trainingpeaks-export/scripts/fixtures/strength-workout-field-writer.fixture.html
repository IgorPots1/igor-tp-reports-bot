<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strength Workout Field Writer Fixture</title>
  </head>
  <body>
    <main>
      <section data-exercise="Glute Bridge">
        <h3>Glute Bridge</h3>
        <label>
          Sets
          <input type="number" aria-label="Sets" value="" />
        </label>
        <label>
          Reps
          <input type="number" aria-label="Reps" value="" />
        </label>
        <label>
          Time
          <input type="text" aria-label="Time" value="hh:mm:ss" />
        </label>
        <label>
          Coach Notes
          <textarea aria-label="Coach Notes"></textarea>
        </label>
      </section>

      <section data-exercise="Forearm Plank">
        <h3>Forearm Plank</h3>
        <label>
          Sets
          <input type="number" aria-label="Sets" value="" />
        </label>
        <label>
          Duration
          <input type="text" aria-label="Duration" placeholder="hh:mm:ss" value="" />
        </label>
        <label>
          Coach Notes
          <textarea aria-label="Coach Notes"></textarea>
        </label>
      </section>
    </main>
  </body>
</html>
