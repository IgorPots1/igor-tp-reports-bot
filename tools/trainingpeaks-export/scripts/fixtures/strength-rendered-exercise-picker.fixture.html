<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrainingPeaks rendered exercise picker fixture</title>
  </head>
  <body>
    <section aria-label="Exercise Library">
      <div>
        <input
          type="text"
          placeholder="Search Exercises, Circuits, or Saved Items"
          aria-label="Search Exercises, Circuits, or Saved Items"
        />
      </div>
      <div role="listbox" data-testid="rendered-exercise-list">
        <button type="button" aria-label="90 Degree Iso Chin Up Hold Biceps">
          <h6>90 Degree Iso Chin Up Hold</h6>
          <span>Biceps</span>
        </button>
        <button type="button" aria-label="90-90 Glute">
          <h6>90-90</h6>
          <span>Glute</span>
        </button>
        <button type="button" aria-label="90-90 to Lunge Quads">
          <h6>90-90 to Lunge</h6>
          <span>Quads</span>
        </button>
        <button type="button" aria-label="Ab Wheel Abs">
          <h6>Ab Wheel</h6>
          <span>Abs</span>
        </button>
        <button type="button" aria-label="Air Squat Hamstrings">
          <h6>Air Squat</h6>
          <span>Hamstrings</span>
        </button>
        <button type="button" aria-label="Alternating DB Bent Over Row Upper Back">
          <h6>Alternating DB Bent Over Row</h6>
          <span>Upper Back</span>
        </button>
        <button type="button" aria-label="Alternating DB Floor Press Chest">
          <h6>Alternating DB Floor Press</h6>
          <span>Chest</span>
        </button>
        <button type="button" aria-label="Alternating DB Hammer Curl Biceps">
          <h6>Alternating DB Hammer Curl</h6>
          <span>Biceps</span>
        </button>
        <button type="button" aria-label="Downward Dog Lunge Rotation Glute">
          <h6>Downward Dog Lunge Rotation</h6>
          <span>Glute</span>
        </button>
        <button type="button" aria-label="Drag Curl Biceps">
          <h6>Drag Curl</h6>
          <span>Biceps</span>
        </button>
        <button type="button" aria-label="Drop Jump Calves">
          <h6>Drop Jump</h6>
          <span>Calves</span>
        </button>
        <button type="button" aria-label="Dynamic Chest Stretch Chest">
          <h6>Dynamic Chest Stretch</h6>
          <span>Chest</span>
        </button>
        <button type="button" aria-label="Dynamic Clam Shell Glute">
          <h6>Dynamic Clam Shell</h6>
          <span>Glute</span>
        </button>
        <button type="button" aria-label="Eagle Arms Stretch Shoulders">
          <h6>Eagle Arms Stretch</h6>
          <span>Shoulders</span>
        </button>
        <button type="button" aria-label="Elbow to Knee Abs">
          <h6>Elbow to Knee</h6>
          <span>Abs</span>
        </button>
        <button type="button" aria-label="Elevated Body Weight Calf Raise Calves">
          <h6>Elevated Body Weight Calf Raise</h6>
          <span>Calves</span>
        </button>
        <button type="button" aria-label="Forearm Plank Abs">
          <h6>Forearm Plank</h6>
          <span>Abs</span>
        </button>
      </div>
    </section>
  </body>
</html>
